id = "vanilla_bestiary"
kind = "native-mod"
name = "Vanilla Bestiary"
summary = "Minecraft's own creatures in the creature guide's bestiary: where you met them, what they eat, give and drop."
description = """
> **Beta.** Played and tested in single player; multiplayer and balance come later. Reports are welcome on the [issues](https://github.com/EAnathos/sunrise-creatures/issues).

An add-on of the [Sunrise Creatures](https://github.com/EAnathos/sunrise-creatures/blob/vanilla_bestiary-0.1.1/README.md) series: Minecraft's own creatures get pages in
the creature guide's bestiary, below the series' creatures, found out in play like them: where you met them, what
breeds and tames them, what they give (milk, wool, eggs, a fish in a bucket), what they drop, and one thing they do (a
creeper exploding, a zombie drowning). A wild one counts, not one from a spawn egg, bred or tamed. It adds no creature
and no item. **Requires** [Sunrise Creatures](https://playsunrise.net/mods/creature), the series' library.

Its design is in [SPECS.md](https://github.com/EAnathos/sunrise-creatures/blob/vanilla_bestiary-0.1.1/mods/vanilla_bestiary/SPECS.md).
"""
