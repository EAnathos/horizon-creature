id = "scorpions"
kind = "native-mod"
name = "Scorpions"
summary = "Real-size scorpions in deserts, badlands and caves: they rear up when you come close and sting when hit. Their stinger makes a dagger you throw."
description = """
> **Beta.** Played and tested in single player; multiplayer and balance come later. Reports are welcome on the [issues](https://github.com/EAnathos/sunrise-creatures/issues).

![](https://raw.githubusercontent.com/EAnathos/sunrise-creatures/main/docs/models/scorpions-scorpion-front.png)

A mod of the [Sunrise Creatures](https://github.com/EAnathos/sunrise-creatures/blob/main/README.md) series: scorpions of real size hiding in the shade
of deserts, badlands and caves, where some glow cyan in the dark. Come close and one rears up, claws open and tail
arched; hit it and it fights back with its claws and a poisoned sting. Its venom makes poison potions and arrows, its
stinger a dagger, and a glass jar makes it a terrarium pet. **Requires** Sunrise Creatures, the series' library.

`/summon scorpions:scorpion ~ ~ ~ {Tags:["cave"]}` makes one of a kind (`desert`, `badlands` or `cave`). The design is
in [SPECS.md](https://github.com/EAnathos/sunrise-creatures/blob/main/mods/scorpions/SPECS.md).
"""
