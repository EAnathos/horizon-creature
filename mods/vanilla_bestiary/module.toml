# Vanilla Bestiary's description for the repository's tools (docs/ARCHITECTURE.md); not shipped in the mod.
id = "vanilla_bestiary"
name = "Vanilla Bestiary"
status = "playable"
# It adds no item.
creative = []
# Its Rust is built on Sunrise's mod_api.
ported = true

# Its page in Sunrise's registry (`cargo creature release`, docs/PUBLISHING.md): with its manifest's name, authors and
# licence, and its README as the description.
[registry]
summary = "Minecraft's own creatures in the creature guide's bestiary: where you met them, what they eat, give and drop."
categories = ["game-mechanics", "utility"]
tags = ["bestiary", "guide", "vanilla", "creatures"]
icon = "common/assets/creature/textures/item/guide.png"
screenshots = ["docs/media/readme/bestiary.webp"]
