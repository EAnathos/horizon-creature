# The fairies' sounds, made by `cargo creature sounds fairies` from freesound downloads (all CC0, nothing to credit).
# A downloaded file keeps the name freesound gives it: it is found by its number. Each clip: a slice of a source
# (`start` and `length` in seconds of the output), resampled by `pitch`, faded out over `fade` seconds, `gain` in dB.
out = "sounds/fairies"

[sources]
wings = 402781   # FunWithSound, Butterfly Wings Fluttering 1 (painted ladies)
chimes = 725474  # Aanimaisema-tiimi, fairy chimes
giggle = 351170  # Reitanna, quick giggle
star = 462095    # LilMati, Sparkling Star 01
star3 = 462093   # LilMati, Sparkling Star 03

# Its wings as it takes off: the butterflies' flutter, a little higher, quiet.
[[clip]]
name = "flutter1"
source = "wings"
start = 0.3
length = 0.7
pitch = 1.2
fade = 0.2
gain = -8.0

[[clip]]
name = "flutter2"
source = "wings"
start = 2.66
length = 0.8
pitch = 1.2
fade = 0.25
gain = -8.0

[[clip]]
name = "flutter3"
source = "wings"
start = 5.0
length = 0.8
pitch = 1.2
fade = 0.25
gain = -8.0

# Now and then, a soft chime: three phrases of the chimes.
[[clip]]
name = "chime1"
source = "chimes"
start = 1.23
length = 2.2
fade = 0.8
gain = -6.0

[[clip]]
name = "chime2"
source = "chimes"
start = 3.8
length = 2.2
fade = 0.8
gain = -6.0

[[clip]]
name = "chime3"
source = "chimes"
start = 6.3
length = 2.4
fade = 0.9
gain = -6.0

# Its tiny laugh: the giggle, higher (a small voice).
[[clip]]
name = "laugh"
source = "giggle"
start = 0.0
length = 0.4
pitch = 1.4
fade = 0.1
gain = -4.0

# Hurt: a short glint of the star, higher; befriended: the whole sparkle; gone: the other star, fading out.
[[clip]]
name = "hurt"
source = "star3"
start = 0.0
length = 0.4
pitch = 1.3
fade = 0.15
gain = -6.0

[[clip]]
name = "befriend"
source = "star"
start = 0.0
length = 2.1
fade = 0.6
gain = -4.0

[[clip]]
name = "death"
source = "star3"
start = 0.0
length = 2.6
pitch = 0.9
fade = 0.9
gain = -4.0
