# The butterflies' and moths' sounds, made by `cargo creature sounds butterflies` from freesound downloads (all CC0, nothing to credit).
# A downloaded file keeps the name freesound gives it: it is found by its number. Each clip: a slice of a source
# (`start` and `length` in seconds of the output), resampled by `pitch`, faded out over `fade` seconds, `gain` in dB.
out = "sounds/butterflies"

[sources]
butterfly = 198818 # Yuval, butterfly wings (a peacock butterfly flapping around the recorder)
moth_a = 131339   # nahmandub, Flying moth 1
moth_b = 131340   # nahmandub, Flying moth 2

# Wing beats taking off: short bursts of the real butterfly, raised a little (the recording is very quiet; loudnorm
# brings it up), then cut quieter than a bird.
[[clip]]
name = "flutter1"
source = "butterfly"
start = 12.75
length = 0.45
pitch = 1.1
fade = 0.12
gain = -8.0

[[clip]]
name = "flutter2"
source = "butterfly"
start = 11.26
length = 0.3
pitch = 1.1
fade = 0.1
gain = -8.0

[[clip]]
name = "flutter3"
source = "butterfly"
start = 13.77
length = 0.3
pitch = 1.1
fade = 0.1
gain = -8.0

# A moth: softer, dustier wings.
[[clip]]
name = "moth1"
source = "moth_a"
start = 0.3
length = 0.8
fade = 0.2
gain = -8.0

[[clip]]
name = "moth2"
source = "moth_b"
start = 0.0
length = 0.7
fade = 0.2
gain = -8.0

