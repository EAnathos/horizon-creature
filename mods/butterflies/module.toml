# Butterflies's description for the repository's tools (docs/ARCHITECTURE.md); not shipped in the mod.
id = "butterflies"
name = "Butterflies"
status = "playable"
# Its items in the series' creative tab, in order.
creative = ["butterflies:butterfly_spawn_egg", "butterflies:moth_spawn_egg", "butterflies:butterfly_dust", "butterflies:confetti"]
# Its Rust is built on Sunrise's mod_api.
ported = true

# Its page in Sunrise's registry (`cargo creature release`, docs/PUBLISHING.md): with its manifest's name, authors and
# licence, and its README as the description.
[registry]
summary = "Butterflies by day and moths by night, in many colours and patterns; catch them in a jar, and their dust makes confetti."
categories = ["mobs", "decoration"]
tags = ["butterflies", "moths", "insects", "ambient"]
icon = "butterfly"
