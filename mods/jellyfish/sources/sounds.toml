# The jellyfish's sounds, made by `cargo creature sounds jellyfish` from freesound downloads (all CC0, nothing to credit).
# A downloaded file keeps the name freesound gives it: it is found by its number. Each clip: a slice of a source
# (`start` and `length` in seconds of the output), resampled by `pitch`, faded out over `fade` seconds, `gain` in dB.
out = "sounds/jellyfish"

[sources]
jelly = 533979   # kaekhor, Jellyfish (a jellyfish swimming, sound design)
flop = 570208    # RatBird, Fish Flopping
sand = 679389    # adviseme333, Fish flopping over on sand
squish = 442772  # qubodup, Slime Squish
sting = 37423    # funkymuskrat, gtarn.wav (being slapped by a jellyfish)

# Its pulse as it swims up: the swells of the swimming recording.
[[clip]]
name = "pulse1"
source = "jelly"
start = 2.2
length = 0.8
pitch = 1.0
fade = 0.3
gain = -10.0

[[clip]]
name = "pulse2"
source = "jelly"
start = 9.55
length = 0.9
pitch = 1.0
fade = 0.3
gain = -10.0

[[clip]]
name = "pulse3"
source = "jelly"
start = 11.6
length = 0.9
pitch = 1.0
fade = 0.3
gain = -10.0

[[clip]]
name = "pulse4"
source = "jelly"
start = 19.2
length = 0.7
pitch = 1.0
fade = 0.3
gain = -10.0

