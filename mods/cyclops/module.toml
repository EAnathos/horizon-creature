# Cyclops's description for the repository's tools (docs/ARCHITECTURE.md); not shipped in the mod.
id = "cyclops"
name = "Cyclops"
status = "playable"
# Its items in the series' creative tab, in order.
creative = ["cyclops:cyclops_spawn_egg", "cyclops:cyclops_eye", "cyclops:club", "cyclops:shepherds_crook"]
# Its Rust is built on Sunrise's mod_api.
ported = true

# Its page in Sunrise's registry (`cargo creature release`, docs/PUBLISHING.md): with its manifest's name, authors and
# licence, and its README as the description.
[registry]
summary = "A one-eyed giant shepherd at cave mouths, with its flock, a club that breaks the ground and boulders it throws."
categories = ["mobs", "adventure"]
tags = ["cyclops", "giant", "hostile", "boss"]
icon = "cyclops"
screenshots = [
  "docs/media/readme/cyclops.webp",
  "docs/models/cyclops-cyclops-front.png",
  "docs/models/cyclops-cyclops-back.png",
]
