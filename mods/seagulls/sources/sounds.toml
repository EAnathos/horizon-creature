# The seagull's sounds, made by `cargo creature sounds seagulls` from freesound downloads (all CC0, nothing to credit).
# A downloaded file keeps the name freesound gives it: it is found by its number. Each clip: a slice of a source
# (`start` and `length` in seconds of the output), resampled by `pitch`, faded out over `fade` seconds, `gain` in dB.
out = "sounds/seagull"

[sources]
single = 263786    # steaq, Seagull single call
beach = 353416     # squashy555, Seagull on beach
laughing = 586831  # speakingmusic, seagull.wav
trill = 75195      # nigelcoop, Seagull trill and whine
wings = 670509     # 2create, Huge wing flaps (the vulture's)
jump = 507091      # paulprit, Fish Jumping Splash 2 (the flying fish's)
release = 507094   # paulprit, Fish Splashing Release 1 (the flying fish's)

# Its cry: the single call, and the calls of a gull on a beach.
[[clip]]
name = "cry1"
source = "single"
start = 0.0
length = 0.45
pitch = 1.0
fade = 0.15
gain = -4.0

[[clip]]
name = "cry2"
source = "beach"
start = 0.6
length = 0.9
pitch = 1.0
fade = 0.3
gain = -4.0

[[clip]]
name = "cry3"
source = "beach"
start = 2.0
length = 0.8
pitch = 1.05
fade = 0.3
gain = -4.0

[[clip]]
name = "cry4"
source = "beach"
start = 2.85
length = 0.5
pitch = 1.0
fade = 0.2
gain = -4.0


