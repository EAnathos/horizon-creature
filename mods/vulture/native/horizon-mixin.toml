# Vulture: the native part (a trait mod, Horizon's docs/native-mods.md, "Trait mods").
# Built and installed by `cargo creature install vulture`.
[mod]
id = "vulture"
version = "0.0.1"

# Reads internal `Mob` fields and injects into `Game` (mixins): pinned.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[api]
path = "api"

# The series' library, reached as the `creature` crate (common/SPECS.md).
[dependencies]
creature = "^0.1"

# The ridden vulture's hearts, without the empty ones.
[[injection]]
id = "mount-hud"
target = "horizon_client::game::mounts::Game<'_>::draw_mount_hud"
kind = "HEAD"
cancellable = true
helper = "mount_hud.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "w", ty = "i32", value = "w" },
  { name = "h", ty = "i32", value = "h" },
]

# Sneak in the air descends instead of getting off; on the ground it still dismounts.
[[injection]]
id = "ride-keys"
target = "horizon_client::game::mounts::Game<'_>::tick_mount_riding"
kind = "HEAD"
cancellable = true
helper = "ride_keys.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "keys", ty = "Keys", value = "keys" },
]
