# Storm Spirits's description for the repository's tools (docs/ARCHITECTURE.md); not shipped in the mod.
id = "storm_spirits"
name = "Storm Spirits"
status = "playable"
# Its items in the series' creative tab, in order.
creative = ["storm_spirits:storm_spirit_spawn_egg", "storm_spirits:spark"]
# Its Rust is built on Sunrise's mod_api.
ported = true

# Its page in Sunrise's registry (`cargo creature release`, docs/PUBLISHING.md): with its manifest's name, authors and
# licence, and its README as the description.
[registry]
summary = "Spirits of living lightning born in thunderstorms: they shock whoever hits them, and their sparks call lightning where you aim."
categories = ["mobs", "magic"]
tags = ["storm", "lightning", "spirit", "neutral"]
icon = "storm_spirit"
screenshots = ["docs/models/storm_spirits-storm_spirit-front.png", "docs/models/storm_spirits-storm_spirit-back.png"]
