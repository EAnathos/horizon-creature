[package]
name = "creature-tools"
version = "0.1.0"
edition = "2024"
description = "Build tools for the Horizon Creature series: module list, creative tab, model conversion, sounds, packaging, installing."
publish = false

[[bin]]
name = "creature-tools"
path = "src/main.rs"

[dependencies]
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip's deflate through flate2's pure-Rust backend (miniz_oxide): no C library to build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Decodes the models' embedded textures and writes their pictures (`cargo creature preview`).
png = "0.18"

# Not part of any workspace: `native/api` is built by the Horizon launcher, against Horizon's own lock file.
[workspace]
