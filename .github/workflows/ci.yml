# Lint, test, check and build every module (docs/ARCHITECTURE.md §6).
#
# The native crates (`native/api/`) are compiled with Clippy against the pinned Horizon source (`cargo creature
# native-check`); the injections (`native/*.rs` helpers) compile only in the launcher's build, inside Horizon's own
# crates: run `cargo creature install` after changing one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The series' pinned Horizon revision (every horizon-mixin.toml; `cargo creature check` enforces it).
  HORIZON_REV: fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca

jobs:
  lint:
    name: Format, lint, test, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - name: rustfmt (tools)
        run: cargo fmt --manifest-path tools/Cargo.toml --check
      - name: rustfmt (native code)
        run: find common mods -path '*/native/*' -name '*.rs' -print0 | xargs -0 rustfmt --edition 2024 --check
      - name: clippy (tools)
        run: cargo clippy --manifest-path tools/Cargo.toml --all-targets --locked -- -D warnings
      - name: tests (tools)
        run: cargo test --manifest-path tools/Cargo.toml --locked
      - name: Repository consistency
        run: cargo creature check

  native:
    name: Native code (Clippy against the pinned Horizon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -yq pkg-config libasound2-dev libudev-dev
      - name: Horizon source at the pinned revision
        run: |
          git init -q "$RUNNER_TEMP/horizon"
          cd "$RUNNER_TEMP/horizon"
          git remote add origin https://github.com/horizon-rust/horizon
          git fetch -q --depth 1 origin "$HORIZON_REV"
          git checkout -q FETCH_HEAD
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools
            target/native-check
      - name: Clippy on the native crates
        run: cargo creature native-check "$RUNNER_TEMP/horizon"

  build:
    name: Build the mods
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - name: Cache cargo-horizon-mod
        id: horizon-mod
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ runner.os }}-${{ env.HORIZON_REV }}
      - name: Install cargo-horizon-mod
        if: steps.horizon-mod.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev "$HORIZON_REV" cargo-horizon-mod
      - name: Build the content and native packages
        run: cargo creature build
      - uses: actions/upload-artifact@v7
        with:
          name: horizon-creature-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
